name: Build APK

permissions:
  contents: read

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Pinned to a known Ubuntu image: ubuntu-latest has moved to a newer release
    runs-on: ubuntu-24.04
    env:
      # Set this repository variable (Settings, Variables) to your HTTPS search server address
      SEARCH_API_BASE: ${{ vars.SEARCH_API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 (API 36) SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager); fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare the signing key from GitHub secrets
        if: ${{ secrets.HMP_KEYSTORE_B64 != '' }}
        env:
          HMP_KEYSTORE_B64: ${{ secrets.HMP_KEYSTORE_B64 }}
          HMP_STORE_PASSWORD: ${{ secrets.HMP_STORE_PASSWORD }}
          HMP_KEY_ALIAS: ${{ secrets.HMP_KEY_ALIAS }}
          HMP_KEY_PASSWORD: ${{ secrets.HMP_KEY_PASSWORD }}
        run: |
          echo "$HMP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hmp-upload.jks"
          {
            echo "HMP_KEYSTORE_PATH=$RUNNER_TEMP/hmp-upload.jks"
            echo "HMP_STORE_PASSWORD=$HMP_STORE_PASSWORD"
            echo "HMP_KEY_ALIAS=$HMP_KEY_ALIAS"
            echo "HMP_KEY_PASSWORD=$HMP_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # If the build failed, copy the compiler errors onto the run page, where they can be read without a sign-in
      - name: Show build errors on the run page
        if: failure()
        run: |
          grep -E '^e: |^w: |FAILURE|What went wrong|Could not|Failed to|Execution failed|Unresolved|error:' build.log \
            | head -40 \
            | while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Keep the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H-Media-Player-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Android lint
        continue-on-error: true
        run: gradle :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: H-Media-Player-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # The release build is the final one to install. It is built after the debug APK is safely saved.
      - name: Build release APK
        continue-on-error: true
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: H-Media-Player-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H-Media-Player-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore

  # When a version tag such as v0.5.1 is pushed, the APK from the build is published on the
  # Releases page under a fixed name, so the download link never changes.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Get the APK saved by the build
        uses: actions/download-artifact@v4
        with:
          name: H-Media-Player-debug
          path: release

      - name: Name the APK for download
        run: mv release/app-debug.apk release/H-Media-Player.apk

      - name: Publish the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          files: release/H-Media-Player.apk
          generate_release_notes: true
