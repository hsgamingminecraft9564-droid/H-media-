name: Device tests (emulator)

# Runs the instrumented tests on an Android emulator. Start it by hand from the Actions tab.
# Real-phone testing is done with DEVICE-TEST-PLAN.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Allow hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: gradle :app:connectedDebugAndroidTest --no-daemon

      - name: Save device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
